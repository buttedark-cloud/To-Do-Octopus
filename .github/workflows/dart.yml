name: Flutter CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # НАЧАЛО ИСПРАВЛЕНИЯ: Создаем структуру папок и файлы-заглушки для прохождения теста
      - name: Create missing config files for CI
        run: |
          mkdir -p core/config
          echo "class SupabaseConfig { static const String url = ''; static const String anonKey = ''; }" > core/config/supabase_config.dart
          echo "class DefaultFirebaseOptions { static var currentPlatform; }" > firebase_options.dart
      # КОНЕЦ ИСПРАВЛЕНИЯ

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test
