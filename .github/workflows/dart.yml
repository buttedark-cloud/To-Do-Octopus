name: Flutter CI

on:
  push:
    branches: [ "main" ] # Поменяйте на master, если у вас главная ветка называется master
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Вот этот шаг устанавливает Flutter SDK на сервер GitHub:
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Теперь зависимости установятся без ошибок:
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test
