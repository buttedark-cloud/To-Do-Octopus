name: Flutter CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Этот важный шаг скачает и развернет Flutter на сервере GitHub:
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Теперь зависимости вашего To-Do приложения успешно установятся:
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test
